<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#bbf7d0" stop-opacity="0.75" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Floating Background Elements -->
  <g opacity="0.35">
    <circle cx="80" cy="80" r="14" fill="#ffffff" />
    <circle cx="420" cy="120" r="20" fill="#ffffff" />
    <circle cx="120" cy="310" r="10" fill="#ffffff" />
    <circle cx="390" cy="300" r="8" fill="#ffffff" />
    <path d="M60,190 L90,190 M75,175 L75,205" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <path d="M430,220 L450,220 M440,210 L440,230" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Flight Path Dashed Curve -->
  <path d="M 60,280 C 120,120 280,110 380,180 C 420,210 400,280 320,280 C 260,280 230,210 280,160" 
        fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,6" opacity="0.65" />

  <!-- Main Globe Base -->
  <g filter="url(#glow)">
    <circle cx="250" cy="210" r="110" fill="url(#globeGrad)" />
    <!-- Globe Meridians and Parallels -->
    <ellipse cx="250" cy="210" rx="60" ry="110" fill="none" stroke="#38a169" stroke-width="2.5" opacity="0.4" />
    <ellipse cx="250" cy="210" rx="110" ry="40" fill="none" stroke="#38a169" stroke-width="2.5" opacity="0.4" />
    <line x1="140" y1="210" x2="360" y2="210" stroke="#38a169" stroke-width="2" opacity="0.4" />
    <!-- Stylized Continents -->
    <path d="M210,160 C230,150 250,170 260,180 C270,190 280,170 290,160 C295,175 285,195 270,205 C250,215 230,200 220,190 Z" fill="#48bb78" opacity="0.6" />
    <path d="M190,210 C205,210 215,225 210,240 C205,255 190,265 180,250 C175,235 180,220 190,210 Z" fill="#48bb78" opacity="0.6" />
    <path d="M280,230 C300,230 315,245 310,260 C300,270 285,265 275,250 Z" fill="#48bb78" opacity="0.6" />
  </g>

  <!-- Passport & Boarding Pass -->
  <g transform="translate(130, 210) rotate(-12)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="110" rx="8" fill="#1e3a5f" />
    <rect x="5" y="5" width="70" height="100" rx="5" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="40" cy="50" r="16" fill="none" stroke="#fbbf24" stroke-width="2" />
    <line x1="20" y1="78" x2="60" y2="78" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="25" y1="88" x2="55" y2="88" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Suitcase -->
  <g transform="translate(260, 200) rotate(8)" filter="url(#glow)">
    <!-- Wheels -->
    <rect x="18" y="105" width="12" height="10" rx="3" fill="#374151" />
    <rect x="70" y="105" width="12" height="10" rx="3" fill="#374151" />
    <!-- Handle -->
    <path d="M38,15 L38,-8 L62,-8 L62,15" fill="none" stroke="#4b5563" stroke-width="4" stroke-linecap="round" />
    <!-- Body -->
    <rect x="10" y="15" width="80" height="95" rx="12" fill="#ffffff" />
    <rect x="16" y="22" width="68" height="81" rx="8" fill="#f3f4f6" />
    <!-- Straps & Tag -->
    <line x1="32" y1="15" x2="32" y2="110" stroke="#10b981" stroke-width="4" />
    <line x1="68" y1="15" x2="68" y2="110" stroke="#10b981" stroke-width="4" />
    <rect x="42" y="55" width="16" height="18" rx="3" fill="#f59e0b" />
  </g>

  <!-- Flying Airplane with Cloud Trail -->
  <g transform="translate(260, 90) rotate(22)" filter="url(#glow)">
    <path d="M0,20 L35,20 L65,0 L80,0 L65,20 L105,20 L115,10 L125,10 L120,25 L125,40 L115,40 L105,30 L65,30 L80,50 L65,50 L35,30 L0,30 Z" 
          fill="#ffffff" />
    <circle cx="25" cy="25" r="4" fill="#38a169" />
  </g>

  <!-- Fluffy Foreground Clouds -->
  <g filter="url(#glow)">
    <!-- Left Cloud -->
    <path d="M70,330 C70,310 90,295 110,300 C120,285 145,285 155,300 C175,295 195,310 195,330 Z" fill="url(#cloudGrad)" />
    <!-- Right Cloud -->
    <path d="M310,340 C310,320 330,305 350,310 C360,295 385,295 395,310 C415,305 435,320 435,340 Z" fill="url(#cloudGrad)" />
  </g>
</svg>
