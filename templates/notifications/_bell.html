{% if show %}
<div class="dropdown">
  <button class="{% if variant == 'site' %}nav-link btn btn-link px-2{% else %}icon-btn{% endif %} position-relative" data-bs-toggle="dropdown" aria-label="Notifications">
    <i class="bi bi-bell"></i>{% if unread %}<span class="bell-count">{{ unread|stringformat:"d" }}</span>{% endif %}
  </button>
  <div class="dropdown-menu dropdown-menu-end shadow border-0 p-0 notif-menu">
    <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
      <strong class="small">Notifications</strong>
      {% if unread %}<form method="post" action="{% url 'notifications:read_all' %}"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><button class="btn btn-link btn-sm p-0 small">Mark all read</button></form>{% endif %}
    </div>
    {% for n in items %}
    <a class="notif-item {% if not n.is_read %}unread{% endif %}" href="{% url 'notifications:open' n.pk %}">
      <span class="icon-circle tone-brand" style="width:34px;height:34px"><i class="bi {{ n.icon }}"></i></span>
      <span class="min-w-0"><span class="d-block fw-600 small text-truncate">{{ n.title }}</span>{% if n.body %}<span class="d-block text-muted-2 text-truncate" style="font-size:.78rem">{{ n.body }}</span>{% endif %}<span class="d-block text-muted-2" style="font-size:.7rem">{{ n.created_at|timesince }} ago</span></span>
    </a>
    {% empty %}<div class="text-center text-muted-2 small py-4">You're all caught up.</div>{% endfor %}
    <a class="d-block text-center small py-2 border-top" href="{% url 'notifications:list' %}">View all</a>
  </div>
</div>
{% endif %}
