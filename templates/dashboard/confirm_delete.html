{% extends "dashboard/_base.html" %}
{% block title %}Delete{% endblock %}
{% block page_title %}Delete “{{ object }}”?{% endblock %}
{% block content %}
<div class="panel" style="max-width:560px"><div class="panel-body">
  <p><i class="bi bi-exclamation-triangle text-danger me-1"></i> This permanently deletes <strong>{{ object }}</strong>. This action can't be undone.</p>
  <form method="post" class="d-flex gap-2">{% csrf_token %}<a class="btn btn-light" href="{{ back_url }}">Cancel</a><button class="btn btn-danger">Yes, delete</button></form>
</div></div>
{% endblock %}
