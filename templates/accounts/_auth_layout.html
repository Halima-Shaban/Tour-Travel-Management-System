{% extends "base.html" %}
{% block navbar %}{% endblock %}{% block footer %}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="side" style="background-image:url('{{ site.hero_background }}')">
    <a href="{% url 'core:home' %}" class="position-absolute top-0 start-0 m-4 text-white fw-bold fs-4 d-flex align-items-center gap-2"><span class="d-inline-grid rounded-3 bg-brand" style="width:36px;height:36px;place-items:center"><i class="bi bi-airplane-fill"></i></span>{{ site.site_name }}</a>
    <h2 class="display-6 fw-bold">{{ site.hero_title }}</h2>
    <p class="opacity-75 mb-0">{{ site.tagline }}</p>
  </div>
  <div class="form-side"><div class="auth-card">{% block auth_form %}{% endblock %}</div></div>
</div>
{% endblock %}
