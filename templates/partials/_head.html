{% load static %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{% block meta_description %}{{ site.tagline }}{% endblock %}">
{% if site.favicon %}<link rel="icon" href="{{ site.favicon.url }}">{% else %}<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family={{ site.font_family|urlencode }}:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
<link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
<link href="{% static 'css/theme.css' %}" rel="stylesheet">
<style>
  :root {
    --brand: {{ site.primary_color }};
    --accent: {{ site.secondary_color }};
    --ink: {{ site.dark_color }};
    --radius: {{ site.border_radius }}px;
    --font: "{{ site.font_family }}";
  }
</style>
<script src="{% static 'js/theme.js' %}"></script>
